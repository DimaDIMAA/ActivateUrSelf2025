<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Bugetul personal</title>
  <link rel="stylesheet" href="../css/bani.css">
</head>
<body>

  <h1>Bugetul personal</h1>  

  <p>Crearea unui buget personal te ajută să înțelegi mai bine fluxul de venituri și cheltuieli, iar prin aceasta să ai un control mai mare asupra finanțelor tale...</p>

  <div class="butoane-lectie">
    <a href="lectie3.html" class="buton-lectie">➡️ Următoarea lecție</a>
    <br><br>
    <a href="../bani.html" class="buton-intoarcere">🏠 Înapoi la lista lecțiilor</a>
  </div>

  <script>
    const idLectie = "2";
    window.onload = () => {
      let lectiiCitite = JSON.parse(localStorage.getItem('lectiiCitite')) || [];
      if (!lectiiCitite.includes(idLectie)) {
        lectiiCitite.push(idLectie);
        localStorage.setItem('lectiiCitite', JSON.stringify(lectiiCitite));
      }
    };
  </script>

</body>
</html>
